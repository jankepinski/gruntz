# Fly.io config. Deploy: `fly launch --no-deploy` (pick an app name), then `fly deploy`.
app = "gruntz"
primary_region = "waw"

[build]

[env]
  PORT = "8686"

[http_service]
  internal_port = 8686
  force_https = true
  # Rooms live in memory: keep one machine up and never stop it mid-game.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "3s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
